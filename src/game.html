<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>COURT SHIFT DUEL</title>
<style>
/*FONTS*/
:root{--ink:#14213D;--gold:#FFD23F;--sun:#FFD23F;--red:#FF3B3B;--blue:#3D8BFF;--mint:#1FCB8B;--paper:#FFF9EA;--display:"Bangers",Impact,sans-serif;--body:"Rubik",system-ui,sans-serif;--mag:pointer}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:#120a06;display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,#6b3a1f 0,#3a1f10 45%,#1c0f08 100%)}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 46px)}
.btn{font-family:var(--display);font-size:22px;letter-spacing:1px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:9px 18px;cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.mint{background:var(--mint)}.btn.sm{font-size:16px;padding:6px 12px}.btn.wh{background:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
/* top */
.top{position:relative;display:flex;align-items:center;gap:6px;padding:max(8px,env(safe-area-inset-top)) 9px 4px}
.logo{white-space:nowrap;font-family:var(--display);font-size:20px;color:var(--gold);letter-spacing:1px;-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 #000;flex:1}
.pill{font-weight:800;font-size:10.5px;padding:3px 8px;border:2px solid var(--ink);border-radius:99px;box-shadow:2px 2px 0 #000;white-space:nowrap;background:var(--paper)}
.pill.P{background:var(--red);color:#fff}.pill.D{background:var(--blue);color:#fff}
.ic{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:14px;display:grid;place-items:center;box-shadow:2px 2px 0 #000;cursor:pointer}
.judge{position:relative;display:flex;gap:7px;align-items:center;margin:2px 9px 6px}
.ava{width:44px;height:44px;flex:none;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:var(--gold);box-shadow:2px 2px 0 #000}
.ava img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.bubble{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:13px;padding:4px 9px;font-weight:600;font-size:12px;line-height:1.28;min-height:44px;box-shadow:2px 2px 0 #000;display:flex;flex-direction:column;justify-content:center}
.bubble b{font-size:9px;letter-spacing:.6px;color:var(--red);text-transform:uppercase}
/* board */
.board{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 8px}
.lane{position:relative;display:flex;flex-direction:column;border-radius:14px;background:linear-gradient(#5a341c,#3e2312);border:3px solid #1a0e06;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);overflow:hidden;min-height:0}
.lane.tgt{outline:3px dashed var(--gold);outline-offset:-3px;animation:lpulse .8s infinite alternate;cursor:pointer}
.lane.no{opacity:.55}
@keyframes lpulse{to{background:linear-gradient(#7a4a24,#4e2c16)}}
.zone{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:5px;align-content:start;min-height:0}
.zone.opp{align-content:end}
.mid{background:var(--paper);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:4px 3px;text-align:center}
.mid .nm{font-family:var(--display);font-size:15px;letter-spacing:.5px;line-height:1}
.mid .pw{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:3px}
.pw span{min-width:30px;font-family:var(--display);font-size:19px;line-height:1.1;padding:0 5px;border:2px solid var(--ink);border-radius:8px;color:#fff}
.pw .P{background:var(--red)}.pw .D{background:var(--blue)}
.pw span.lead{transform:scale(1.18);box-shadow:0 0 0 3px var(--gold)}
.mid .st{font-size:9px;font-weight:800;text-transform:uppercase;margin-top:2px}
.mid .evb{margin-top:3px;font-size:9.5px;font-weight:700;background:var(--ink);color:var(--gold);border-radius:7px;padding:2px 3px;line-height:1.15}
.chip{position:relative;aspect-ratio:1;border-radius:9px;border:2px solid var(--ink);overflow:hidden;background:#fff;box-shadow:1px 2px 0 #000}
.chip img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.chip .em{display:grid;place-items:center;height:100%;font-size:22px}
.chip .pv{position:absolute;right:-1px;bottom:-1px;min-width:19px;text-align:center;font-family:var(--display);font-size:14px;color:#fff;border:2px solid var(--ink);border-radius:7px 0 7px 0;padding:0 2px}
.chip.P .pv{background:var(--red)}.chip.D .pv{background:var(--blue)}
.chip.P{border-color:#7a1010}.chip.D{border-color:#0b3a8a}
.chip.struck{filter:grayscale(1) brightness(.7)}.chip.struck:after{content:"✖";position:absolute;inset:0;display:grid;place-items:center;color:var(--red);font-size:34px;font-weight:900;text-shadow:0 0 3px #fff}
.chip.pend{border-style:dashed;opacity:.85;cursor:pointer}
.chip.new{animation:cflip .5s ease both}
.chip.hit{animation:shake .4s}
@keyframes cflip{from{transform:rotateY(90deg) scale(1.3)}to{transform:none}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* hand */
.handbar{display:flex;align-items:center;gap:8px;padding:6px 9px 2px}
.clock{font-family:var(--display);font-size:20px;color:var(--gold);letter-spacing:1px;text-shadow:2px 2px 0 #000;white-space:nowrap}
.hint{flex:1;color:#fff;font-size:11.5px;font-weight:700;line-height:1.2;opacity:.9}
.hand{display:flex;gap:7px;padding:5px 9px max(10px,env(safe-area-inset-bottom));overflow-x:auto;min-height:172px}
.card{position:relative;flex:0 0 112px;height:162px;border-radius:13px;border:3px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 #000;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:transform .15s}
.card.P{background:linear-gradient(#fff 0,#FFE3E3 100%)}.card.D{background:linear-gradient(#fff 0,#DCEBFF 100%)}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 4px var(--gold),3px 8px 0 #000}
.card.dis{opacity:.45}
.card .tyb{position:absolute;left:4px;top:42px;z-index:2;font-size:9px;font-weight:800;text-transform:uppercase;padding:1px 5px;border:2px solid var(--ink);border-radius:8px;color:var(--ink);white-space:nowrap;box-shadow:1px 1px 0 #000}
.card .ty{font-size:9px!important}
.chip .ti{position:absolute;left:-1px;top:-1px;width:17px;height:17px;display:grid;place-items:center;font-size:10px;border:2px solid var(--ink);border-radius:0 0 7px 0;z-index:2}
.mid .nm i{font-style:normal;margin-right:2px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px;text-align:left;font-size:11.5px;font-weight:700}.legend span{border:2px solid var(--ink);border-radius:8px;padding:2px 6px}
.card.react .cost{background:var(--gold);color:var(--ink)}
.hl{animation:hlp .8s infinite alternate;position:relative;z-index:5}
@keyframes hlp{from{box-shadow:0 0 0 3px #FFD23F,3px 3px 0 #000}to{box-shadow:0 0 0 7px #FFD23F,0 0 22px #FFD23F}}
.coach.forced{pointer-events:none}.coach.forced .btn{display:none}
.tgtrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tgt{width:96px;background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 #000;padding:5px;cursor:pointer;font-size:11px;font-weight:700;line-height:1.2;text-align:center}
.tgt .a{height:64px;border-radius:8px;overflow:hidden;border:2px solid var(--ink);margin-bottom:4px;background:#eee}.tgt .a img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}.tgt .a .em{font-size:34px;display:grid;place-items:center;height:100%}
.tgt{overflow-wrap:anywhere}.tgt .pw{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:0 6px;margin-top:3px}
.tip{display:flex;gap:8px;align-items:flex-start;background:#FFF6CC;border:3px solid var(--ink);border-radius:12px;padding:6px 8px;text-align:left;font-size:12.5px;font-weight:600}.tip img{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);flex:none}
.card .art{height:62px;flex:none;background:#fff;border-bottom:2px solid var(--ink)}
.card .art img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.card .art .em{display:grid;place-items:center;height:100%;font-size:34px}
.card .cost,.card .pow{position:absolute;top:3px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:16px;z-index:2}
.card .cost{left:3px;background:var(--gold)}.card .pow{right:3px;color:#fff}
.card.P .pow{background:var(--red)}.card.D .pow{background:var(--blue)}
.card .nm{font-weight:800;font-size:11px;line-height:1.1;text-align:center;padding:3px 3px 1px}
.card .kw{font-size:9.5px;font-weight:600;line-height:1.15;text-align:center;padding:0 4px;flex:1;overflow:hidden}
.card .ty{font-size:8.5px;font-weight:800;text-transform:uppercase;text-align:center;padding:2px;background:var(--ink);color:#fff;letter-spacing:.3px}
.drag{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-60%) rotate(-4deg) scale(.9);opacity:.92}
/* overlays */
.ov{position:absolute;inset:0;z-index:30;background:rgba(8,6,4,.84);display:none;place-items:center;padding:14px}
.ov.show{display:grid}
.modal{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:7px 7px 0 #000;width:100%;max-width:420px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:10px;animation:popin .28s cubic-bezier(.2,1.4,.4,1);max-height:100%;overflow-y:auto}
.modal>*{flex-shrink:0}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.badge{align-self:center;background:var(--ink);color:var(--gold);font-weight:800;font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:99px;text-transform:uppercase}
.mt{font-family:var(--display);font-size:30px;line-height:1;letter-spacing:1px}
.mp{font-size:13.5px;font-weight:600;line-height:1.4}
.say{background:#fff;border:3px solid var(--ink);border-radius:13px;padding:7px 9px;text-align:left;font-size:13px;font-weight:600;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.say b{display:block;font-size:10px;letter-spacing:.5px;color:var(--red);text-transform:uppercase}
.pi{width:42px;height:42px;flex:none;border-radius:50%;border:3px solid var(--ink);object-fit:cover;object-position:50% 20%}
.face{width:100px;height:100px;border-radius:20px;border:4px solid var(--ink);box-shadow:4px 4px 0 #000;object-fit:cover;background:#fff}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.casecard,.choice{background:#fff;border:3px solid var(--ink);border-radius:13px;box-shadow:3px 3px 0 #000;padding:8px 10px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}
.casecard img{width:48px;height:48px;border-radius:11px;border:3px solid var(--ink);object-fit:cover}
.casecard b,.choice b{display:block;font-size:14px}.casecard span,.choice span{font-size:12px;font-weight:600;color:#555}
.casecard .st{margin-left:auto;font-size:12px;white-space:nowrap;text-align:right}
.note{background:#EEF4FF;border:2px dashed var(--blue);border-radius:12px;padding:9px;text-align:left;font-size:12.5px;line-height:1.4;font-weight:600}
.note b{color:var(--blue)}
.stats{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:9px;text-align:left;font-size:13px;font-weight:600;line-height:1.55}
.stars{font-size:32px;letter-spacing:4px}
.title-big{font-family:var(--display);font-size:56px;line-height:.9;color:var(--gold);-webkit-text-stroke:2.5px var(--ink);text-shadow:5px 5px 0 #000;letter-spacing:2px}
.rank{display:inline-block;background:var(--ink);color:var(--gold);font-weight:800;font-size:12px;padding:4px 10px;border-radius:99px}
.doc{position:relative;background:#fff;border:2px solid #999;box-shadow:3px 3px 0 rgba(0,0,0,.25);padding:13px 13px 17px;text-align:left;font-family:Georgia,"Times New Roman",serif;color:#111;font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
.doc .dh{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:6px}
.doc .dh b{font-size:12px;letter-spacing:.5px}.doc .dh span{text-align:right;font-weight:700;font-size:11.5px}
.doc .ds{font-weight:700;letter-spacing:1px;font-size:11px;margin:9px 0 2px;border-bottom:1px solid #ccc}
.doc ol{margin:2px 0 0 18px}
.doc .dsig{margin-top:12px;font-size:12px}.doc .dsig span{font-family:"Brush Script MT",cursive;font-size:22px;color:#1b3a8a}
.dstamp{position:absolute;right:10px;bottom:16px;transform:rotate(-14deg);font-family:var(--display);font-size:25px;letter-spacing:1px;border:4px solid;border-radius:10px;padding:2px 10px;opacity:.85}
.dstamp.g{color:#C81E1E;border-color:#C81E1E}.dstamp.n{color:#0b5fd0;border-color:#0b5fd0}
.stamp{position:absolute;left:50%;top:38%;z-index:45;transform:translate(-50%,-50%) scale(0) rotate(-10deg);font-family:var(--display);font-size:38px;color:var(--gold);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);background:var(--red);border:4px solid var(--ink);border-radius:16px;padding:5px 16px;pointer-events:none;white-space:nowrap;transition:transform .22s cubic-bezier(.2,1.5,.4,1)}
.stamp.on{transform:translate(-50%,-50%) scale(1) rotate(-7deg)}.stamp.D{background:var(--blue);color:#fff}
.ticker{position:absolute;left:10px;right:10px;top:46%;z-index:40;pointer-events:none;display:flex;justify-content:center}
.ticker div{background:var(--ink);color:#fff;font-weight:700;font-size:13px;line-height:1.3;padding:8px 12px;border-radius:12px;border:3px solid var(--gold);box-shadow:4px 4px 0 #000;max-width:94%;text-align:center;animation:popin .25s}
.black{position:absolute;inset:0;z-index:50;background:#000;color:#fff;display:none;place-items:center;font-family:var(--display);font-size:34px;letter-spacing:2px;text-align:center;padding:20px}
.black.show{display:grid;animation:popin .5s}
.curtain{position:absolute;inset:0;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;color:#fff}
.curtain.show{display:flex}.curtain.P{background:radial-gradient(#8B2E2E,#2a0808)}.curtain.D{background:radial-gradient(#1c4f9a,#06142e)}
.curtain .mt{color:#fff;font-size:40px}
.coach{position:absolute;left:10px;right:10px;z-index:42;display:none;gap:10px;align-items:flex-start;background:#fff;border:4px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 #000;padding:9px}
.coach.show{display:flex}
.coach img{width:50px;height:50px;border-radius:12px;border:3px solid var(--ink);flex:none}
.coach .ctx{font-size:12.5px;font-weight:600;line-height:1.35;flex:1}
.coach .ctx b{display:block;font-family:var(--display);font-size:16px;color:var(--red)}
.coach .btn{margin-top:5px;font-size:14px;padding:3px 12px}
.toast{position:absolute;left:50%;bottom:200px;transform:translateX(-50%);z-index:44;background:var(--ink);color:#fff;font-weight:700;font-size:12.5px;padding:7px 11px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:90%;text-align:center}
.toast.on{opacity:1}
.cardbig{display:flex;justify-content:center}.cardbig .card{flex:0 0 150px;height:210px;transform:none}.cardbig .card .art{height:90px}.cardbig .card .kw{font-size:11px}.cardbig .card .nm{font-size:13px}
/* splash */
#splash{position:absolute;inset:0;z-index:60;overflow:hidden;cursor:pointer}
#splash.off{display:none}
.dawn{position:absolute;inset:0;background:#0B1433;transition:opacity .8s}
#splash.p2 .dawn{opacity:0;pointer-events:none}
.titlecard{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:hidden;background:radial-gradient(circle at 50% 32%,#FFF1A8 0,#FFC93C 22%,#FF8A1F 55%,#C8321E 100%)}
.titlecard:before{content:"";position:absolute;left:50%;top:32%;width:200vmax;height:200vmax;margin:-100vmax;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 8deg,transparent 8deg 16deg);-webkit-mask:none;mask:none;animation:spin 80s linear infinite;pointer-events:none}
.titlecard>*{position:relative}
.titlecard .tsub{font-weight:800;font-size:15px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink);text-align:center;transform:rotate(-1.5deg)}
.titlecard .tap{font-family:var(--display);font-size:24px;letter-spacing:2px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);animation:tapp 1.1s ease-in-out infinite alternate;opacity:1}
@keyframes tapp{from{transform:scale(.94)}to{transform:scale(1.06)}}
#splash.p2 .titlecard{display:flex}
.tsub{color:#fff;font-weight:800;font-size:15px;text-align:center;text-shadow:1px 1px 0 #000}
.tap{color:#fff;font-weight:800;animation:blink 1.4s infinite}
.pz{position:absolute;inset:0;z-index:46;background:rgba(8,6,4,.88);display:none;align-items:center;justify-content:center;padding:14px}
.pz.show{display:flex}
.pzb{width:100%;max-width:400px;background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:7px 7px 0 #000;padding:12px;display:flex;flex-direction:column;gap:9px;text-align:center;animation:popin .25s}
.pzh{display:flex;gap:9px;align-items:center;text-align:left}.pzh .art{width:54px;height:54px;flex:none;border-radius:12px;border:3px solid var(--ink);overflow:hidden;background:#fff}.pzh .art img{width:100%;height:100%;object-fit:cover}.pzh .art .em{font-size:30px;display:grid;place-items:center;height:100%}
.pzh b{display:block;font-family:var(--display);font-size:21px;letter-spacing:.5px;line-height:1}.pzh span{font-size:12px;font-weight:700;opacity:.75}
.pzt{height:10px;border:2px solid var(--ink);border-radius:9px;overflow:hidden;background:#fff}.pzt i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transform-origin:left}
.pzq{font-size:14px;font-weight:700;line-height:1.35}
.sent{font-size:15px;font-weight:600;line-height:1.7;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px}
.sent.tapme span{display:inline-block;padding:0 3px;margin:1px;border-radius:6px;cursor:pointer;background:#FFF4C2;border:1px solid #e8d38a}
.sent.tapme span:active{background:var(--gold)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font-size:30px;letter-spacing:3px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 0;cursor:pointer;box-shadow:3px 3px 0 #000}
.opt:active{transform:translate(2px,2px)}
.target{font-size:38px;letter-spacing:5px;background:var(--ink);color:#fff;border-radius:12px;padding:6px}
.slots{display:flex;gap:5px;justify-content:center}.slots i{width:34px;height:40px;border:3px solid var(--ink);border-radius:8px;background:#fff;font-family:var(--display);font-size:24px;font-style:normal;display:grid;place-items:center}
.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:52px}
.tile{width:42px;height:46px;border:3px solid var(--ink);border-radius:9px;background:var(--gold);font-family:var(--display);font-size:26px;display:grid;place-items:center;cursor:pointer;box-shadow:2px 3px 0 #000;animation:drop .45s cubic-bezier(.3,1.4,.5,1) both}
.tile.used{visibility:hidden}
.opt.sm{font-size:22px;letter-spacing:1px;font-family:var(--display)}
.tl{display:flex;flex-direction:column;gap:6px}
.tli{position:relative;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:7px 34px 7px 9px;text-align:left;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:2px 2px 0 #000}
.tli b{font-family:var(--display);font-size:17px;color:var(--red);margin-right:4px}
.tli span{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px}

function describe(e){const L=tx(REKN[e.l]),N=e.c?tx(e.c.name):"",W=SIDE[e.s]();
 switch(e.t){case"play":return null;
  case"obj":return {txt:S(`✋ ${W} invänder på ${L}! ${e.n} kort stryks.`,`✋ ${W} objects on ${L}! ${e.n} card(s) struck.`),st:S("INVÄNDNING!","OBJECTION!")};
  case"objmiss":return {txt:e.blocked?S(`🔨 Invändningen på ${L} lämnas utan avseende.`,`🔨 The objection on ${L} is overruled.`):S(`✋ ${W} invände på ${L}, men där spelades inget nytt.`,`✋ ${W} objected on ${L}, but nothing new was played there.`)};
  case"strike":return {txt:S(`💥 ${N}: ${tx(e.x.c.name)} faller på ${L}.${e.x.c.rebut?` "${tx(e.x.c.rebut)}"`:""}`,`💥 ${N}: ${tx(e.x.c.name)} falls on ${L}.${e.x.c.rebut?` "${tx(e.x.c.rebut)}"`:""}`),st:S("BEVISET FALLER!","EVIDENCE FALLS!"),hit:e.x.c.uid};
  case"debuff":return {txt:S(`📉 ${N}: ${e.n} bevis på ${L} försvagas (−2).`,`📉 ${N}: ${e.n} item(s) on ${L} weakened (−2).`)};
  case"whiff":return {txt:S(`💨 ${N} på ${L} hittade inget att angripa.`,`💨 ${N} on ${L} found nothing to attack.`)};
  case"boost":return {txt:S(`📈 ${N} stärker åklagarens bevis på ${L}.`,`📈 ${N} strengthens the prosecution on ${L}.`)};
  case"struckObj":return null;case"fail":return {txt:S(`😬 ${N} på ${L} var för svajigt och fick ingen effekt.`,`😬 ${N} on ${L} was too shaky and had no effect.`)};case"close":return {txt:S(`🎙️ ${W} pläderar om ${L} (+3).`,`🎙️ ${W} argues ${L} (+3).`)};
  case"arthurClash":return {txt:S("🕵️ Båda sidor kallade Arthur! Åklagaren lägger fram sin bevisning först, så han vittnar för åklagaren.","🕵️ Both sides called Arthur! The prosecution presents its evidence first, so he testifies for the prosecution."),st:"ARTHUR!"};
  case"arthurGone":return {txt:S(`🕵️ Arthur vittnar för ${W.toLowerCase()}. Han kan inte vittna för båda sidor${e.had?", så motpartens Arthur-kort försvinner":""}.`,`🕵️ Arthur testifies for ${W.toLowerCase()}. He can't testify for both sides${e.had?", so the other side's Arthur card is removed":""}.`)};
  case"flip":return {txt:S(`🔄 Vänd på steken! ${tx(e.x.c.name)} på ${L} hjälper nu ${W.toLowerCase()}.`,`🔄 Turn the tables! ${tx(e.x.c.name)} on ${L} now helps ${W.toLowerCase()}.`),st:S("VÄND PÅ STEKEN!","TABLES TURNED!"),hit:e.x.c.uid}}}
function doReveal(){const ev=reveal(G);G.lastRev=G.turn;sfxp("scene");UI.planner=G.mode==="hot"?"P":G.seat.A;render();

 let k=0;const step=()=>{if(k<msgs.length){const m=msgs[k++];$("ticker").innerHTML=`<div>${m.txt}</div>`;if(m.st)stamp(m.st,"");if(m.hit){const el=document.querySelector(`.chip[data-uid="${m.hit}"]`);el&&el.classList.add("hit")}setTimeout(step,1700)}

function afterReveal(){if(UI.tut&&!UI.seen.r1){UI.seen.r1=1;return coach(S("Så funkar det: högst styrka vinner en bana. Du måste leda på ALLA tre när domen faller. Försvaret slår tillbaka med taktiker som fäller vissa typer av bevis. Sprid ut dig och var svår att läsa!","Here's how it works: highest strength wins a lane. You must lead ALL three when the verdict comes. The defense strikes back with tactics that break certain kinds of evidence. Spread out and be hard to read!"),"#board",afterReveal)}

function objection(r,t,cb){const o=opp(r),x=t.x,objC=useKw(G,r,"obj");setFace(r,"Obj",2600);stamp(S("INVÄNDNING!","OBJECTION!"),"");

  else setTimeout(()=>{const ok=Math.random()<.75;if(ok)G.stats[seatOf(G,r)].obj++;ruling(ok,x,cb)},1300)};

function reactPhase(done){const roles=["P","D"];let busyCheck=0;

  ${UI.tut&&!UI.seen.obj?(UI.seen.obj=1,tip(S("Motparten har lagt kort. Du har en <b>Invändning</b> på handen! Tryck på ett kort och hitta felet i pusslet. Lyckas du bifaller domaren och kortet stryks.","The other side has played cards. You have an <b>Objection</b> in hand! Tap a card and find the flaw in the puzzle. Get it right and the judge sustains it: the card is struck."))):`<div class="mp" style="font-size:12px">${S("Klara pusslet så bifaller rätten. Motparten kan bemöta med Genmäle.","Solve the puzzle and the court sustains it. The other side may rebut.")}</div>`}

  $("ticker").innerHTML=`<div>${msg[0]}<br>${msg[1]}</div>`;setTimeout(()=>{$("ticker").innerHTML="";deliberate()},2400);return}
  const seat=seats.shift(),r=G.seat[seat];const go=()=>modal(`<span class="badge">🎙️ ${S("Slutanförande","Closing")} · ${seatName(seat)}</span><div class="mt" style="font-size:24px">${r==="P"?S("Vilket rekvisit vill du styrka?","Which element will you prove?"):S("Vilket rekvisit vill du så tvivel om?","Which element will you doubt?")}</div>
   ${[0,1,2].map(l=>`<div class="choice" onclick="G.close['${r}']=${l};closeModal();(${"window.__ask"})()"><div><b>${tx(REKN[l])}: <span style="color:#C81E1E">${power(G,"P",l)}</span> – <span style="color:#0b5fd0">${power(G,"D",l)}</span></b><span>${tx(C.rek[l])}</span></div></div>`).join("")}
   <div class="mp" style="font-size:12px">${S("+3 på den banan för din sida. Motparten väljer i hemlighet.","+3 on that lane for your side. The other side chooses in secret.")}</div>`);

window.deliberate=()=>{if(G.delib)return;G.delib=1;closeModal();const B=$("black"),J=[[CF.kaffe,S("Nämndeman Kaffe","Lay judge Coffee"),S("Kan vi ta en bulle först?","Can we have a bun first?")],[CF.noggrann,S("Nämndeman Noggrann","Lay judge Thorough"),S("Jag har räknat. Vi går igenom banorna en i taget.","I've done the sums. Let's go lane by lane.")],[CF.nyfiken,S("Nämndeman Nyfiken","Lay judge Curious"),S("Men vad hände egentligen?","But what really happened?")]];let n=0;

function judgment(){if(G.over)return;G.over=true;const v=verdictOf(G),guilty=v.guilty;setFace(guilty?"D":"P","Sad",60000);setFace(guilty?"P":"D","Obj",60000);try{setTrack("puzzle")}catch(e){}
 const winRole=guilty?"P":"D",res={};["A","B"].forEach(s=>{const r=G.seat[s],st=G.stats[s],lanesWon=v.lanes.filter(x=>x===r).length,win=r===winRole;
  res[s]={r,win,pts:lanesWon*100+st.strikes*20+st.obj*30+(win?200:0),stars:Math.min(3,(win?1:0)+(lanesWon>=2?1:0)+(st.strikes+st.obj>=3?1:0)),lanesWon,st}});
 const me=res.A;if(G.mode==="ai"){save.xp=(save.xp||0)+me.pts;const p=save[C.id]||{stars:0};save[C.id]={stars:Math.max(p.stars,me.stars)};save.tut=1;store()}
 sfxp(G.mode==="ai"?(me.win?"win":"cold"):"win");
 const rows=[0,1,2].map(l=>`<li><b>${tx(REKN[l])}</b> (${tx(C.rek[l])}): ${v.lanes[l]==="P"?S("styrkt utom rimligt tvivel","proven beyond reasonable doubt"):S("<u>inte styrkt</u>, det finns rimligt tvivel","<u>not proven</u>, there is reasonable doubt")} (${power(G,"P",l)}–${power(G,"D",l)}).</li>`).join("");
 const stood=[0,1,2].flatMap(l=>G.lanes[l].P.filter(x=>!x.struck&&x.c.n!==undefined).map(x=>tx(x.c.name).toLowerCase())),fell=[0,1,2].flatMap(l=>G.lanes[l].P.filter(x=>x.struck&&x.c.n!==undefined).map(x=>tx(x.c.name).toLowerCase()));
 const dom=`<div class="doc"><div class="dh"><b>${S("SOLSTADS TINGSRÄTT","SOLSTAD DISTRICT COURT")}</b><span>${S("DOM","JUDGMENT")}<br>${C.code}</span></div>
 <div class="ds">${S("PARTER","PARTIES")}</div><div><b>${S("Åklagare","Prosecutor")}:</b> ${ROLEN.P()}<br><b>${S("Tilltalad","Accused")}:</b> ${who(C)}<br><b>${S("Offentlig försvarare","Defense counsel")}:</b> ${ROLEN.D()}</div>
 <div class="ds">${S("DOMSLUT","OPERATIVE PART")}</div><div>${guilty?S(`${who(C)} döms för ${C.crime}.<br><b>Påföljd:</b> ${C.pen[0]}.`,`${who(C)} is convicted of ${C.crimeEn}.<br><b>Sanction:</b> ${C.pen[1]}.`)+(C.dmg?`<br><b>${S("Skadestånd","Damages")}:</b> ${tx(C.dmg)}`:""):S(`Åtalet ogillas. ${who(C)} frikänns.`,`The charge is dismissed. ${who(C)} is acquitted.`)}</div>
 <div class="ds">${S("DOMSKÄL","REASONS")}</div><div>${S("Bevisning som bestått","Evidence that stood")}: ${stood.join(", ")||S("ingen","none")}.${fell.length?" "+S("Bevisning rätten inte fäst avseende vid","Evidence disregarded")+": "+fell.join(", ")+".":""}<br>${S("Varje del av gärningsbeskrivningen måste vara styrkt:","Every element of the charge must be proven:")}<ol>${rows}</ol>${guilty?S("Åtalet är styrkt.","The charge is proven."):S("Åtalet är inte styrkt i alla delar och ska ogillas.","The charge is not proven in every part and must be dismissed.")}</div>
 <div class="ds">${S("HUR MAN ÖVERKLAGAR","HOW TO APPEAL")}</div><div style="font-size:11px">${S("Överklagande ställs till hovrätten men ges in till tingsrätten senast tre veckor från i dag.","An appeal is addressed to the Court of Appeal but filed with the district court within three weeks.")}</div>
 <div class="dsig">${S("På tingsrättens vägnar","For the district court")}<br><span>Sven Uggla</span><br>${S("Rådman","Judge")}</div><div class="dstamp ${guilty?"g":"n"}">${guilty?S("FÄLLD","GUILTY"):S("FRIKÄND","ACQUITTED")}</div></div>`;
 const card=s=>{const r=res[s];return `<div class="stats"><b>${seatName(s)}</b> · ${r.r==="P"?S("åklagare","prosecutor"):S("försvar","defense")} ${r.win?"🏆":""}<br>${"⭐".repeat(r.stars)}${"☆".repeat(3-r.stars)}<br>${S("Banor vunna","Lanes won")}: ${r.lanesWon} · ${S("Fällda bevis","Strikes")}: ${r.st.strikes} · ${S("Invändningar","Objections")}: ${r.st.obj}<br><b>${r.pts} ${G.mode==="ai"?"XP":S("poäng","points")}</b></div>`};
 const head=G.mode==="ai"?`<div class="mt" style="color:${me.win?"#0B7A55":"var(--red)"}">${me.win?S("DU VANN MÅLET! 🏆","YOU WON THE CASE! 🏆"):S("MOTPARTEN VANN","THE OTHER SIDE WON")}</div>`:`<div class="mt">${res.A.win?seatName("A"):seatName("B")} ${S("vinner!","wins!")} 🏆</div>`;
 const r0=rankOf((save.xp||0)-(G.mode==="ai"?me.pts:0)),r1=rankOf(save.xp||0),up=G.mode==="ai"&&r1[0]!==r0[0];
 window.__dom=dom;const short=`<span class="badge">${S("Tingsrättens dom","The verdict")}</span><div class="vstamp ${guilty?"g":"n"}">${guilty?S("FÄLLD!","GUILTY!"):S("FRIKÄND!","ACQUITTED!")}</div>
 <div class="vrows">${[0,1,2].map(l=>`<div><span>${tx(REKN[l])}</span><span class="${v.lanes[l]==="P"?"ok":"no"}">${v.lanes[l]==="P"?S("✔ styrkt","✔ proven"):S("✖ tvivel","✖ doubt")} ${power(G,"P",l)}–${power(G,"D",l)}</span></div>`).join("")}</div>
 ${head}${card("A")}${G.mode==="hot"?card("B"):""}${up?`<div class="mt" style="font-size:22px">🎓 ${S("Befordrad till","Promoted to")} ${S(r1[1],r1[2])}!</div>`:""}
 <div class="row"><button class="btn" onclick="callCase()">${S("SPELA IGEN","PLAY AGAIN")}</button><button class="btn sm wh" onclick="home()">${S("MENY","MENU")}</button></div><button class="link" onclick="readDom()">📜 ${S("Läs hela domen","Read the full judgment")}</button>`;

function coach(text,sel,cb,forced){const c=$("coach");c.classList.toggle("forced",!!forced);$("coachImg").src=ARTHUR;$("coachT").textContent=text;const el=sel&&document.querySelector(sel),ar=$("app").getBoundingClientRect(),r=el?el.getBoundingClientRect():null;

  return coach(S("Välkommen till rätten! Det här är dina kort. Tryck på kortet som lyser. Siffran uppe till vänster är vad det kostar i minuter.","Welcome to court! These are your cards. Tap the glowing card. The number top-left is its cost in minutes."),"#hand",null,true)}
 if(G.turn===2&&!UI.seen.t2){UI.seen.t2=1;return coach(S("Nu har du 2 minuter. Varje runda får du mer tid. Bevis är låsta till sitt rekvisit (står längst ner på kortet).","Now you have 2 minutes, more each round. Evidence is locked to its element (shown at the bottom of the card)."),"#hand")}
 const ai=h.findIndex(c=>c.id==="arthur");if(ai>=0&&!UI.seen.ar){UI.seen.ar=1;h.unshift(h.splice(ai,1)[0]);UI.glow=0;render();return coach(myRole()==="P"?S("Det är ju jag! Kalla in mig som vittne. Mitt vittnesmål kan inte fällas av försvarets trovärdighetskort.","Why, that's me! Call me as a witness. My testimony can't be broken by the defense's credibility cards."):S("Det är ju jag! Jag har hittat en lucka i utredningen. Lägg mig där åklagaren är starkast så fäller jag deras bästa kort.","Why, that's me! I found a gap in the investigation. Play me where the prosecution is strongest and I'll strike their best card."),"#hand",()=>{UI.glow=-1;render()})}
 let v=h.findIndex(c=>c.kw==="vand");if(v>=0&&!UI.seen.v){UI.seen.v=1;h.unshift(h.splice(v,1)[0]);v=0;UI.glow=v;render();return coach(S("Du drog <Vänd på steken>! Lägg det på en bana där motparten har ett starkt kort. Det kortet byter sida och hjälper dig i stället.","You drew <Turn the tables>! Play it on a lane where the other side has a strong card. That card switches sides and helps you instead."),"#hand",()=>{UI.glow=-1;render()})}}
