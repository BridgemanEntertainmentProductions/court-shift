:root{--ink:#14213D;--gold:#FFD23F;--sun:#FFD23F;--red:#FF3B3B;--blue:#3D8BFF;--mint:#1FCB8B;--paper:#FFF9EA;--display:"Bangers",Impact,sans-serif;--body:"Rubik",system-ui,sans-serif;--mag:pointer}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:#120a06;display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,#6b3a1f 0,#3a1f10 45%,#1c0f08 100%)}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 46px)}
.btn{font-family:var(--display);font-size:22px;letter-spacing:1px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:9px 18px;cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.mint{background:var(--mint)}.btn.sm{font-size:16px;padding:6px 12px}.btn.wh{background:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
/* top */
.top{position:relative;display:flex;align-items:center;gap:6px;padding:max(8px,env(safe-area-inset-top)) 9px 4px}
.logo{white-space:nowrap;font-family:var(--display);font-size:20px;color:var(--gold);letter-spacing:1px;-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 #000;flex:1}
.pill{font-weight:800;font-size:10.5px;padding:3px 8px;border:2px solid var(--ink);border-radius:99px;box-shadow:2px 2px 0 #000;white-space:nowrap;background:var(--paper)}
.pill.P{background:var(--red);color:#fff}.pill.D{background:var(--blue);color:#fff}
.ic{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:14px;display:grid;place-items:center;box-shadow:2px 2px 0 #000;cursor:pointer}
.judge{position:relative;display:flex;gap:7px;align-items:center;margin:2px 9px 6px}
.ava{width:44px;height:44px;flex:none;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:var(--gold);box-shadow:2px 2px 0 #000}
.ava img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.bubble{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:13px;padding:4px 9px;font-weight:600;font-size:12px;line-height:1.28;min-height:44px;box-shadow:2px 2px 0 #000;display:flex;flex-direction:column;justify-content:center}
.bubble b{font-size:9px;letter-spacing:.6px;color:var(--red);text-transform:uppercase}
/* board */
.board{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 8px}
.lane{position:relative;display:flex;flex-direction:column;border-radius:14px;background:linear-gradient(#5a341c,#3e2312);border:3px solid #1a0e06;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);overflow:hidden;min-height:0}
.lane.tgt{outline:3px dashed var(--gold);outline-offset:-3px;animation:lpulse .8s infinite alternate;cursor:pointer}
.lane.no{opacity:.55}
@keyframes lpulse{to{background:linear-gradient(#7a4a24,#4e2c16)}}
.zone{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:5px;align-content:start;min-height:0}
.zone.opp{align-content:end}
.mid{background:var(--paper);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:4px 3px;text-align:center}
.mid .nm{font-family:var(--display);font-size:15px;letter-spacing:.5px;line-height:1}
.mid .pw{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:3px}
.pw span{min-width:30px;font-family:var(--display);font-size:19px;line-height:1.1;padding:0 5px;border:2px solid var(--ink);border-radius:8px;color:#fff}
.pw .P{background:var(--red)}.pw .D{background:var(--blue)}
.pw span.lead{transform:scale(1.18);box-shadow:0 0 0 3px var(--gold)}
.mid .st{font-size:9px;font-weight:800;text-transform:uppercase;margin-top:2px}
.mid .evb{margin-top:3px;font-size:9.5px;font-weight:700;background:var(--ink);color:var(--gold);border-radius:7px;padding:2px 3px;line-height:1.15}
.chip{position:relative;aspect-ratio:1;border-radius:9px;border:2px solid var(--ink);overflow:hidden;background:#fff;box-shadow:1px 2px 0 #000}
.chip img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.chip .em{display:grid;place-items:center;height:100%;font-size:22px}
.chip .pv{position:absolute;right:-1px;bottom:-1px;min-width:19px;text-align:center;font-family:var(--display);font-size:14px;color:#fff;border:2px solid var(--ink);border-radius:7px 0 7px 0;padding:0 2px}
.chip.P .pv{background:var(--red)}.chip.D .pv{background:var(--blue)}
.chip.P{border-color:#7a1010}.chip.D{border-color:#0b3a8a}
.chip.struck{filter:grayscale(1) brightness(.7)}.chip.struck:after{content:"✖";position:absolute;inset:0;display:grid;place-items:center;color:var(--red);font-size:34px;font-weight:900;text-shadow:0 0 3px #fff}
.chip.pend{border-style:dashed;opacity:.85;cursor:pointer}
.chip.new{animation:cflip .5s ease both}
.chip.hit{animation:shake .4s}
@keyframes cflip{from{transform:rotateY(90deg) scale(1.3)}to{transform:none}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* hand */
.handbar{display:flex;align-items:center;gap:8px;padding:6px 9px 2px}
.clock{font-family:var(--display);font-size:20px;color:var(--gold);letter-spacing:1px;text-shadow:2px 2px 0 #000;white-space:nowrap}
.hint{flex:1;color:#fff;font-size:11.5px;font-weight:700;line-height:1.2;opacity:.9}
.hand{display:flex;gap:7px;padding:5px 9px max(10px,env(safe-area-inset-bottom));overflow-x:auto;min-height:172px}
.card{position:relative;flex:0 0 112px;height:162px;border-radius:13px;border:3px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 #000;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:transform .15s}
.card.P{background:linear-gradient(#fff 0,#FFE3E3 100%)}.card.D{background:linear-gradient(#fff 0,#DCEBFF 100%)}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 4px var(--gold),3px 8px 0 #000}
.card.dis{opacity:.45}

/* Sound: synthesised with Web Audio, no files. Browsers stay silent until the first tap. */
let AC=null;
function ctx(){
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended"&&!document.hidden)AC.resume();return AC;}catch(e){return null;}
}
function ac(){return save.mute?null:ctx();}
function tone(f,at,d,type,vol,f2){
  const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(at||0);
  o.type=type||"triangle";o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
function hiss(d,vol,freq){
  const a=ac();if(!a)return;
  const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const src=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();
  src.buffer=buf;fl.type="bandpass";fl.frequency.value=freq;g.gain.value=vol;
  src.connect(fl);fl.connect(g);g.connect(a.destination);src.start();
}

/* Music: two quiet generated tracks. "puzzle" is a slow lo-fi groove (marimba, plucked strings,
   soft bass and brushes). "palace" has no drums: held strings, a ticking clock and a slow cello line.
   Everything is scheduled a little ahead of the audio clock and runs through a low-pass filter. */
const MUS={on:false,id:0,next:0,step:0,track:"puzzle",g:{},bus:null,noise:null};
function hz(m){return 440*Math.pow(2,(m-69)/12);}
function musBus(){
  const a=AC;if(MUS.bus)return;
  const lp=a.createBiquadFilter(),m=a.createGain();
  lp.type="lowpass";lp.frequency.value=2400;m.gain.value=.9;lp.connect(m);m.connect(a.destination);
  MUS.bus=lp;MUS.master=m;
  for(const k of ["puzzle","palace"]){const g=a.createGain();g.gain.value=k===MUS.track?1:0;g.connect(lp);MUS.g[k]=g;}
  const n=a.sampleRate,buf=a.createBuffer(1,n,n),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
  MUS.noise=buf;
}
function mPluck(dest,m,at,d,type,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=hz(m);
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+d);
  o.connect(g);g.connect(dest);o.start(at);o.stop(at+d+.03);
}
function mPad(dest,m,at,d,vol){
  const g=AC.createGain();
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+1);g.gain.setValueAtTime(vol,at+d-.4);g.gain.linearRampToValueAtTime(0,at+d+1);
  g.connect(dest);
  for(const det of [-6,6]){const o=AC.createOscillator();o.type="triangle";o.frequency.value=hz(m);o.detune.value=det;o.connect(g);o.start(at);o.stop(at+d+1.05);}
}
function mCello(dest,m,at,d,vol){
  const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
  o.type="sawtooth";o.frequency.value=hz(m);f.type="lowpass";f.frequency.value=700;
  l.frequency.value=5;lg.gain.value=9;l.connect(lg);lg.connect(o.detune);
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.3);g.gain.setValueAtTime(vol,at+d-.25);g.gain.linearRampToValueAtTime(0,at+d+.35);
  o.connect(f);f.connect(g);g.connect(dest);o.start(at);l.start(at);o.stop(at+d+.4);l.stop(at+d+.4);
}
function mNoise(dest,at,d,vol,type,freq){
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=MUS.noise;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);
  s.connect(f);f.connect(g);g.connect(dest);s.start(at,Math.random()*.8,d+.02);
}
function mKick(dest,at,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(115,at);o.frequency.exponentialRampToValueAtTime(44,at+.16);
  g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.0001,at+.22);
  o.connect(g);g.connect(dest);o.start(at);o.stop(at+.25);
}
const PZ_CH=[[38,[62,65,69,72]],[46,[58,62,65,69]],[43,[58,62,65,67]],[45,[57,61,64,67]],[38,[62,65,69,72]],[41,[57,60,64,65]],[43,[58,62,65,67]],[45,[57,61,64,67]]];
const PZ_ARP=[[1,0],[3,2],[4,1],[6,3],[7,2]];
const PZ_MEL=[[[2,74],[3,77],[5,76]],[[0,74]],[[2,74],[3,70],[5,72]],[[0,73],[4,76]],[[2,69],[3,74],[5,77]],[[0,76],[3,72]],[[2,74],[4,70]],[[1,73],[3,76],[5,79]],
              [],[[4,77],[5,74]],[],[[2,76],[3,73],[4,69]],[[0,74]],[],[[3,70],[5,74]],[[2,73],[4,69]]];
const PL_CH=[[50,57,62,65],[50,57,62,65],[55,58,62],[57,62,65],[58,62,65],[55,58,62],[57,61,64],[50,57,62]];
const PL_MEL=[[[0,50,2],[2,53,2]],[[0,52,4]],[[0,55,2],[2,53,2]],[[0,57,4]],[[0,58,2],[2,57,2]],[[0,55,4]],[[0,52,2],[2,49,2]],[[0,50,4]]];
const TRACKS={
  puzzle:{sp:60/76/2,len:128,sched(step,at){
    const g=MUS.g.puzzle,bar=step>>3,s=step&7,ch=PZ_CH[bar%8],root=ch[0],tones=ch[1];
    if(s&1)at+=this.sp*.16; // swing
    if(s===0||s===5)mKick(g,at,s===0?.13:.08);
    if(s===2||s===6)mNoise(g,at,.09,.035,"bandpass",1700);
    mNoise(g,at,.03,s&1?.016:.01,"highpass",6000);
    if(s===0){mPluck(g,root,at,.55,"sine",.13);mPluck(g,root+12,at,.4,"triangle",.035);}
    if(s===3||s===7){mPluck(g,root+7,at,.3,"sine",.08);mPluck(g,root+19,at,.25,"triangle",.02);}
    PZ_ARP.forEach(p=>{if(p[0]===s){const m=tones[bar&1?3-p[1]:p[1]]+12;mPluck(g,m,at,.5,"sine",.05);mPluck(g,m+24,at,.1,"sine",.007);}});
    PZ_MEL[bar%16].forEach(n=>{if(n[0]===s)mPluck(g,n[1],at,.22,"triangle",.04);});
  }},
  palace:{sp:1,len:32,sched(step,at){
    const g=MUS.g.palace,bar=step>>2,s=step&3;
    mNoise(g,at,.025,.03,"bandpass",s&1?2200:3200); // tick, tock
    if(s===0)PL_CH[bar].forEach(m=>mPad(g,m,at,4,.026));
    PL_MEL[bar].forEach(n=>{if(n[0]===s)mCello(g,n[1],at,n[2]*this.sp,.05);});
  }}
};
function musicTick(){
  const a=AC;if(!a||!MUS.on||a.state!=="running")return;
  const tr=TRACKS[MUS.track];
  if(MUS.next<a.currentTime)MUS.next=a.currentTime+.06;
  while(MUS.next<a.currentTime+.3){tr.sched(MUS.step,MUS.next);MUS.next+=tr.sp;MUS.step=(MUS.step+1)%tr.len;}
}
function setTrack(name){
  if(MUS.track===name)return;
  const old=MUS.track;MUS.track=name;MUS.step=0;
  if(!MUS.on||!AC||!MUS.bus)return;
  const now=AC.currentTime;
  MUS.g[old].gain.setTargetAtTime(0,now,.25);MUS.g[name].gain.setTargetAtTime(1,now+.2,.25);
  MUS.next=now+.5;
}
function startMusic(){
  if(save.music===false||MUS.on)return;
  const a=ctx();if(!a)return;
  musBus();
  MUS.master.gain.cancelScheduledValues(a.currentTime);MUS.master.gain.setValueAtTime(.9,a.currentTime);
  for(const k in MUS.g)MUS.g[k].gain.setValueAtTime(k===MUS.track?1:0,a.currentTime);
  MUS.on=true;MUS.step=0;MUS.next=a.currentTime+.2;
  MUS.id=setInterval(musicTick,90);
}
function stopMusic(){
  MUS.on=false;clearInterval(MUS.id);
  if(MUS.master&&AC)MUS.master.gain.setTargetAtTime(0,AC.currentTime,.05);
}

function aiPlan(g,s){const h=g.hand[s];let budget=energy(g);
 const visP=l=>power(g,"P",l),visD=l=>power(g,"D",l);

 for(let k=0;k<6;k++){const order=shuf(h.map((c,i)=>i));tries.push(order)}
 const score=(plan)=>{/* estimate lane powers after plan */
  const add={P:[0,0,0],D:[0,0,0]};plan.forEach(([i,l])=>{const c=h[i];if(c.kw==="vand"){const m=Math.max(0,...g.lanes[l][opp(s)].filter(x=>!x.struck).map(x=>x.pow));add[s][l]+=m;add[opp(s)][l]-=m;return}add[s][l]+=c.pow+(c.kw&&/^strike|arthurD/.test(c.kw)?3:0)+(c.kw&&/^debuff/.test(c.kw)?2:0)});
  let sc=0;for(let l=0;l<3;l++){const P=visP(l)+add.P[l],D=visD(l)+add.D[l];
   if(s==="P"){const d=P-D;sc+=Math.min(d,6)+(d>0?6:0)}else{const d=D-P;sc+=Math.max(-6,Math.min(d,8))+(d>=0?10:0)}}
  if(s==="P"){const m=Math.min(...[0,1,2].map(l=>visP(l)+add.P[l]-visD(l)-add.D[l]));sc+=m*1.5}
  return sc+RK()*3};
 let best=[],bs=-1e9;
 for(const order of tries){const plan=[];let left=budget;const cnt=[0,1,2].map(l=>g.lanes[l][s].length);
  for(const i of order){const c=h[i];if(c.cost>left||isReact(c))continue;
   let lanes=c.lane>=0?[c.lane]:[0,1,2];lanes=lanes.filter(l=>g.lanes[l].ev!=="closed"&&cnt[l]<MAXLANE);if(!lanes.length)continue;
   let l;if(c.kw==="vand"){const bl=lanes.map(x=>[x,Math.max(0,...g.lanes[x][opp(s)].filter(y=>!y.struck).map(y=>y.pow))]).sort((a,b)=>b[1]-a[1])[0];if(bl[1]<3)continue;l=bl[0]}
   else if(c.kw==="arthurD"){const bl=lanes.map(x=>[x,Math.max(0,...g.lanes[x][opp(s)].filter(y=>!y.struck).map(y=>y.pow))]).sort((a,b)=>b[1]-a[1])[0];l=bl[0]}
   else if(/^(strike|debuff)/.test(c.kw)){const ty=c.kw.slice(-3);const hit=lanes.filter(x=>g.lanes[x][opp(s)].some(y=>!y.struck&&y.c.ty===ty));l=hit.length?hit[RK()*hit.length|0]:lanes[RK()*lanes.length|0]}
   else if(s==="P")l=lanes.sort((a,b)=>(visP(a)-visD(a))-(visP(b)-visD(b)))[0];
   else l=lanes.sort((a,b)=>(visD(a)-visP(a))-(visD(b)-visP(b)))[RK()<.6?lanes.length-1:0];
   plan.push([i,l]);left-=c.cost;cnt[l]++}
  const sc=score(plan);if(sc>bs){bs=sc;best=plan}}
 best.map(([i])=>h[i]).forEach((c,k)=>{const l=best[k][1];const idx=h.indexOf(c);place(g,s,idx,l,RK()<.78?1:0)})}

function puzzle(c,cb,lbl){const kind=pzKind(c),box=$("pzb"),T={word:11000,timeline:10000,memory:7500,pair:9000,clock:9000,odd:10000}[kind]||8000;let done=false,start=performance.now(),raf;

  box.insertAdjacentHTML("beforeend",`<div class="pzr ${ok?"ok":"bad"}">${lbl?lbl[ok?0:1]:ok?S("ÖVERTYGANDE! Full styrka","CONVINCING! Full strength"):S("SVAJIGT... halv styrka","SHAKY... half strength")}</div>`);

 const tick=()=>{const f=Math.min(1,1-(performance.now()-start)/T),b=$("pzbar");if(b)b.style.transform=`scaleX(${Math.max(0,f)})`;if(f<=0)return finish(false);raf=requestAnimationFrame(tick)};
 const choose=(opts,right,big)=>{const sh=opts.map(o=>[o,Math.random()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);return `<div class="opts">${sh.map(o=>`<div class="opt ${big?"":"sm"}" data-o="${o}">${o}</div>`).join("")}</div>`};
 const bindOpts=right=>box.querySelectorAll(".opt").forEach(el=>el.onclick=()=>finish(el.dataset.o===right));
 if(kind==="contra"||kind==="flaw"){let src=tx(c.text);if(kind==="flaw")src=tx(pick(C.ev.map(r=>[r[4],r[5]])));
  const words=src.replace(/[.,:!?"']/g,"").split(" ");const cand=words.map((w,i)=>[w,i]).filter(([w])=>w.length>=3);const [w0,k]=pick(cand.length?cand:words.map((w,i)=>[w,i]));
  let rep=pick(SWAP[LANG]);while(rep.toLowerCase()===w0.toLowerCase())rep=pick(SWAP[LANG]);
  const b=words.map((w,i)=>i===k?rep:w);
  box.innerHTML=head(kind==="flaw"?S("HITTA LUCKAN!","FIND THE FLAW!"):S("HITTA MOTSÄGELSEN!","SPOT THE CONTRADICTION!"),S("tryck på ordet som ändrats","tap the word that changed"))+
  `<div class="pzq">${kind==="flaw"?S("Protokollet:","The record:"):S("Vittnet i förhöret:","The witness in the interview:")}</div><div class="sent">${words.join(" ")}</div><div class="pzq">${S("Vittnet i rätten:","The witness in court:")}</div>
  <div class="sent tapme">${b.map((w,i)=>`<span data-i="${i}">${w}</span>`).join(" ")}</div>`;
  box.querySelectorAll(".tapme span").forEach(el=>el.onclick=()=>finish(+el.dataset.i===k))}
 else if(kind==="match"){const tgt=Array.from({length:3},()=>pick(SYM));const opts=[tgt.join("")];
  while(opts.length<4){const o=[...tgt];const j=Math.random()*3|0;let r=pick(SYM);while(r===o[j])r=pick(SYM);o[j]=r;const st=o.join("");if(!opts.includes(st))opts.push(st)}
  box.innerHTML=head(S("MATCHA SPÅRET!","MATCH THE TRACE!"),S("hitta exakt samma spår","find the exact same trace"))+`<div class="target">${tgt.join("")}</div>`+choose(opts,0,1);bindOpts(tgt.join(""))}
 else if(kind==="memory"){const tgt=Array.from({length:4},()=>pick(SYM)),key=tgt.join("");const opts=[key];
  while(opts.length<4){const o=[...tgt];const j=Math.random()*4|0;let r=pick(SYM);while(r===o[j])r=pick(SYM);o[j]=r;const st=o.join("");if(!opts.includes(st))opts.push(st)}

  start+=1800;setTimeout(()=>{if(done)return;const t=$("memT");if(t){t.textContent="❓❓❓❓";$("memO").style.visibility="visible"}},1800);bindOpts(key)}
 else if(kind==="timeline"){const ev=[...EVT[LANG]].sort(()=>Math.random()-.5).slice(0,4);const base=18*60+(Math.random()*12|0)*15;let ts=[];while(ts.length<4){const t=base+(Math.random()*36|0)*5;if(!ts.includes(t))ts.push(t)}

  const opts=[ans];[-10,10,-15,15,20,-5,5].sort(()=>Math.random()-.5).forEach(o=>{if(opts.length<4&&!opts.includes(hm(st+d+o)))opts.push(hm(st+d+o))});

 else if(kind==="odd"){/* same symbol everywhere; one copy is subtly altered */

  const v=pick([...(sym?[]:["transform:scaleX(-1)"]),"transform:rotate(16deg)","transform:scale(.8)","filter:hue-rotate(45deg) saturate(1.3)"]);
  box.innerHTML=head(S("HITTA DEN FALSKA!","FIND THE FAKE!"),S("en av dem är förfalskad","one of them is forged"))+`<div class="grid4">${Array.from({length:16},(_,i)=>`<div class="gc" data-i="${i}"><span style="display:inline-block;${i===k?v:""}">${e}</span></div>`).join("")}</div>`;
  box.querySelectorAll(".gc").forEach(el=>el.onclick=()=>{if(done)return;if(+el.dataset.i===k)finish(true);else shake(el)})}
 else if(kind==="count"){const [t,...rest]=[...CNT].sort(()=>Math.random()-.5);const n=3+(Math.random()*5|0);const cells=Array.from({length:16},(_,i)=>i<n?t:pick(rest.slice(0,2))).sort(()=>Math.random()-.5);

 else if(kind==="pair"){const pool=[...SYM,"🔑","🧤","👣","🔍"].sort(()=>Math.random()-.5);const tw=pool[0],cells=[tw,tw,...pool.slice(1,7)].sort(()=>Math.random()-.5);let first=null;

  box.querySelectorAll(".gc").forEach(el=>el.onclick=()=>{if(done)return;const i=+el.dataset.i;if(first===null){first=i;el.classList.add("on");sfxp("pick");return}if(first===i)return;

 else{const src=tx(c.text).replace(/[.,:!?"'()]/g,"").split(" ");const cand=src.filter(w=>/^[A-Za-zÅÄÖåäöÉé]{4,7}$/.test(w));let word=(cand.length?pick(cand):"BEVIS").toUpperCase();

 <div class="ds">${S("DOMSKÄL","REASONS")}</div><div>${S("Bevisning som bestått","Evidence that stood")}: ${stood.join(", ")||S("ingen","none")}.${fell.length?" "+S("Bevisning rätten inte fäst avseende vid","Evidence disregarded")+": "+fell.join(", ")+".":""}<br>${S("Varje del av gärningsbeskrivningen måste vara styrkt:","Every element of the charge must be proven:")}<ol>${rows}</ol>${guilty?S("Åtalet är styrkt.","The charge is proven."):S("Åtalet är inte styrkt i alla delar och ska ogillas.","The charge is not proven in every part and must be dismissed.")}</div>
 <div class="ds">${S("HUR MAN ÖVERKLAGAR","HOW TO APPEAL")}</div><div style="font-size:11px">${S("Överklagande ställs till hovrätten men ges in till tingsrätten senast tre veckor från i dag.","An appeal is addressed to the Court of Appeal but filed with the district court within three weeks.")}</div>
 <div class="dsig">${S("På tingsrättens vägnar","For the district court")}<br><span>Sven Uggla</span><br>${S("Rådman","Judge")}</div><div class="dstamp ${guilty?"g":"n"}">${guilty?S("FÄLLD","GUILTY"):S("FRIKÄND","ACQUITTED")}</div></div>`;
 const card=s=>{const r=res[s];return `<div class="stats"><b>${seatName(s)}</b> · ${r.r==="P"?S("åklagare","prosecutor"):S("försvar","defense")} ${r.win?"🏆":""}<br>${"⭐".repeat(r.stars)}${"☆".repeat(3-r.stars)}<br>${S("Banor vunna","Lanes won")}: ${r.lanesWon} · ${S("Fällda bevis","Strikes")}: ${r.st.strikes} · ${S("Invändningar","Objections")}: ${r.st.obj}<br><b>${r.pts} ${G.mode==="ai"?"XP":S("poäng","points")}</b></div>`};
 const head=G.mode==="ai"?`<div class="mt" style="color:${me.win?"#0B7A55":"var(--red)"}">${me.win?S("DU VANN MÅLET! 🏆","YOU WON THE CASE! 🏆"):S("MOTPARTEN VANN","THE OTHER SIDE WON")}</div>`:`<div class="mt">${res.A.win?seatName("A"):seatName("B")} ${S("vinner!","wins!")} 🏆</div>`;
 const r0=rankOf((save.xp||0)-(G.mode==="ai"?me.pts:0)),r1=rankOf(save.xp||0),up=G.mode==="ai"&&r1[0]!==r0[0];
 window.__dom=dom;const short=`<span class="badge">${S("Tingsrättens dom","The verdict")}</span><div class="vstamp ${guilty?"g":"n"}">${guilty?S("FÄLLD!","GUILTY!"):S("FRIKÄND!","ACQUITTED!")}</div>
 <div class="vrows">${[0,1,2].map(l=>`<div><span>${tx(REKN[l])}</span><span class="${v.lanes[l]==="P"?"ok":"no"}">${v.lanes[l]==="P"?S("✔ styrkt","✔ proven"):S("✖ tvivel","✖ doubt")} ${power(G,"P",l)}–${power(G,"D",l)}</span></div>`).join("")}</div>
 ${head}${card("A")}${G.mode==="hot"?card("B"):""}${up?`<div class="mt" style="font-size:22px">🎓 ${S("Befordrad till","Promoted to")} ${S(r1[1],r1[2])}!</div>`:""}
 <div class="row"><button class="btn" onclick="callCase()">${S("SPELA IGEN","PLAY AGAIN")}</button><button class="btn sm wh" onclick="home()">${S("MENY","MENU")}</button></div><button class="link" onclick="readDom()">📜 ${S("Läs hela domen","Read the full judgment")}</button>`;
 window.__short=short;modal(short)}
window.readDom=()=>modal(`${window.__dom}${note(verdictOf(G).guilty?"rek":"doubt")}<button class="btn" onclick="modal(window.__short)">${S("TILLBAKA","BACK")}</button>`);
/* coach */
function coach(text,sel,cb,forced){const c=$("coach");c.classList.toggle("forced",!!forced);$("coachImg").src=ARTHUR;$("coachT").textContent=text;const el=sel&&document.querySelector(sel),ar=$("app").getBoundingClientRect(),r=el?el.getBoundingClientRect():null;
 const below=r&&(r.top-ar.top)<ar.height*.35;c.style.top=below?(r.bottom-ar.top+8)+"px":"auto";c.style.bottom=below?"auto":(r?Math.max(8,ar.bottom-r.top+10):190)+"px";c.classList.add("show");c._cb=cb;$("coachOk").onclick=()=>hideCoach()}
function hideCoach(silent){const c=$("coach");if(!c.classList.contains("show"))return;c.classList.remove("show");const cb=c._cb;c._cb=null;if(cb&&!silent)cb()}
function tutor(){if(!UI.tut)return;const h=G.hand[myRole()];
 if(G.turn===1&&!UI.seen.t1){UI.seen.t1=1;UI.ts="card";const gi=h.findIndex(c=>c.cost===1&&!isReact(c));if(gi>0)h.unshift(h.splice(gi,1)[0]);UI.glow=gi>=0?0:-1;render();
  return coach(S("Välkommen till rätten! Det här är dina kort. Tryck på kortet som lyser. Siffran uppe till vänster är vad det kostar i minuter.","Welcome to court! These are your cards. Tap the glowing card. The number top-left is its cost in minutes."),"#hand",null,true)}
 if(G.turn===2&&!UI.seen.t2){UI.seen.t2=1;return coach(S("Nu har du 2 minuter. Varje runda får du mer tid. Bevis är låsta till sitt rekvisit (står längst ner på kortet).","Now you have 2 minutes, more each round. Evidence is locked to its element (shown at the bottom of the card)."),"#hand")}
 const ai=h.findIndex(c=>c.id==="arthur");if(ai>=0&&!UI.seen.ar){UI.seen.ar=1;h.unshift(h.splice(ai,1)[0]);UI.glow=0;render();return coach(myRole()==="P"?S("Det är ju jag! Kalla in mig som vittne. Mitt vittnesmål kan inte fällas av försvarets trovärdighetskort.","Why, that's me! Call me as a witness. My testimony can't be broken by the defense's credibility cards."):S("Det är ju jag! Jag har hittat en lucka i utredningen. Lägg mig där åklagaren är starkast så fäller jag deras bästa kort.","Why, that's me! I found a gap in the investigation. Play me where the prosecution is strongest and I'll strike their best card."),"#hand",()=>{UI.glow=-1;render()})}
 let v=h.findIndex(c=>c.kw==="vand");if(v>=0&&!UI.seen.v){UI.seen.v=1;h.unshift(h.splice(v,1)[0]);v=0;UI.glow=v;render();return coach(S("Du drog <Vänd på steken>! Lägg det på en bana där motparten har ett starkt kort. Det kortet byter sida och hjälper dig i stället.","You drew <Turn the tables>! Play it on a lane where the other side has a strong card. That card switches sides and helps you instead."),"#hand",()=>{UI.glow=-1;render()})}}
window.tutorial=()=>{save.tut=0;store();UI.mode="ai";C=CASES[0];callCase()};
/* misc */
$("homeBtn").onclick=()=>{if(!G||G.over||confirm(S("Avbryta målet?","Abandon the case?")))home()};
$("gbBtn").onclick=()=>{if(C)modal(`<span class="badge">📜</span>${indictment()}<button class="btn" onclick="closeModal()">${S("TILLBAKA","BACK")}</button>`)};
$("noteBtn").onclick=()=>{const k=pick(Object.keys(NOTES).filter(k=>k!=="penguin"||(C&&C.id==="zoo")));modal(`<span class="badge">📖 ${S("Juristens fotnot","Lawyer's note")}</span>${note(k)}<button class="btn" onclick="${G&&!G.over?"closeModal()":"home()"}">${S("TILLBAKA","BACK")}</button>`)};
$("musBtn").onclick=()=>{save.music=save.music===false;store();if(save.music===false){try{stopMusic()}catch(e){}$("musBtn").textContent="🔇"}else{try{startMusic()}catch(e){}$("musBtn").textContent="🔊"}};
if(save.music===false)$("musBtn").textContent="🔇";
$("judgeImg").src=CF.judge;document.documentElement.lang=LANG;
(function intro(){const sp=$("splash");$("tcP").src=CF.granit;$("tcD").src=CF.filur;$("tlP").textContent=S("ÅKLAGARE","PROSECUTOR");$("tlD").textContent=S("FÖRSVARARE","DEFENSE");$("tpres").textContent="BRIDGEMAN ENTERTAINMENT "+S("PRESENTERAR","PRESENTS");$("tsub").textContent=S("Ett mål. Två sidor. Du vet aldrig vilken.","One case. Two sides. You never know which.");$("taptxt").textContent=S("Tryck för att börja","Tap to start");
 C=CASES[0];$("accImg").src=PORTRAITS[C.id];
 if(matchMedia("(prefers-reduced-motion:reduce)").matches){sp.classList.add("off");home();return}
 $("nightsky").innerHTML=Array.from({length:44},()=>`<i class="star" style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*2}s"></i>`).join("");
 $("st1").innerHTML="BRIDGEMAN".split("").map((l,i)=>`<span style="animation-delay:${1.2+i*.08}s">${l}</span>`).join("");
 try{sfx.dawn()}catch(e){}let ph=1;const next=()=>{if(ph===1){ph=2;clearTimeout(t);sp.classList.add("p2");try{sfx.title()}catch(e){}}else if(ph===2){ph=3;sp.classList.add("off");try{startMusic()}catch(e){}home()}};const t=setTimeout(next,5800);sp.onclick=next})();
</script>
